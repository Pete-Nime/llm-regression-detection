name: LLM Regression Detection

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  llm-regression-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

            # Test our Python regression gate before calling the LLM
      - name: Run automated unit tests
        run: |
          python -m pytest tests/ -v

      - name: Evaluate prompt v2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.evaluator v2

      - name: Compare v1 vs v2
        run: |
          python -m src.run_comparison \
            reports/evaluation_v1.json \
            reports/evaluation_v2.json

      - name: Send Slack regression alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m src.slack_notifier

      - name: Run regression gate
        run: |
          python -m src.ci_gate

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-regression-report
          path: |
            reports/evaluation_v2.json
            reports/comparison_report.json
            reports/evaluation_report.html